<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- background -->
  <rect width="512" height="512" rx="100" fill="#ffe9b3"/>
  <!-- ground -->
  <rect y="380" width="512" height="132" fill="#a8e6a3"/>
  <rect y="375" width="512" height="10" fill="#7ab368"/>

  <!-- mushroom shadow -->
  <ellipse cx="256" cy="430" rx="120" ry="14" fill="rgba(0,0,0,0.2)"/>

  <!-- body (stem) -->
  <path d="M 160 320 Q 160 430 256 430 Q 352 430 352 320 Z" fill="#fff0d4" stroke="#3a1810" strokeWidth="10"/>

  <!-- cap with gradient -->
  <defs>
    <radialGradient id="capGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffaa7a"/>
      <stop offset="60%" stop-color="#ff7a3d"/>
      <stop offset="100%" stop-color="#c84818"/>
    </radialGradient>
  </defs>
  <path d="M 80 290 Q 80 110 256 100 Q 432 110 432 290 Q 410 320 256 320 Q 100 320 80 290 Z" fill="url(#capGrad)" stroke="#3a1810" strokeWidth="10"/>

  <!-- cap rim shadow -->
  <path d="M 90 290 Q 256 330 422 290 Q 410 320 256 320 Q 100 320 90 290 Z" fill="#8a2a08" opacity="0.5"/>

  <!-- highlight on cap -->
  <ellipse cx="180" cy="160" rx="45" ry="18" fill="#ffaa7a" opacity="0.6"/>

  <!-- white spots -->
  <ellipse cx="170" cy="200" rx="32" ry="26" fill="#ffffff" stroke="#c84818" strokeWidth="4"/>
  <ellipse cx="320" cy="180" rx="38" ry="32" fill="#ffffff" stroke="#c84818" strokeWidth="4"/>
  <ellipse cx="256" cy="250" rx="22" ry="18" fill="#ffffff" stroke="#c84818" strokeWidth="4"/>

  <!-- eyes -->
  <ellipse cx="206" cy="370" rx="14" ry="18" fill="#1a1a1a"/>
  <ellipse cx="306" cy="370" rx="14" ry="18" fill="#1a1a1a"/>
  <circle cx="210" cy="365" r="5" fill="white"/>
  <circle cx="310" cy="365" r="5" fill="white"/>

  <!-- smile -->
  <path d="M 226 405 Q 256 425 286 405" stroke="#3a1810" strokeWidth="9" fill="none" stroke-linecap="round"/>

  <!-- cheeks -->
  <ellipse cx="180" cy="405" rx="15" ry="11" fill="#ff8585" opacity="0.7"/>
  <ellipse cx="332" cy="405" rx="15" ry="11" fill="#ff8585" opacity="0.7"/>
</svg>
