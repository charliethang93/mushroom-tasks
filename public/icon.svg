<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- LCD green background with rounded corners -->
  <rect width="32" height="32" rx="6" ry="6" fill="#8aa874"/>

  <!-- Egg outline (top arc) -->
  <rect x="12" y="3" width="8" height="1" fill="#1a2a1a"/>
  <rect x="10" y="4" width="2" height="1" fill="#1a2a1a"/>
  <rect x="20" y="4" width="2" height="1" fill="#1a2a1a"/>
  <rect x="8" y="5" width="2" height="1" fill="#1a2a1a"/>
  <rect x="22" y="5" width="2" height="1" fill="#1a2a1a"/>
  <rect x="7" y="6" width="1" height="1" fill="#1a2a1a"/>
  <rect x="24" y="6" width="1" height="1" fill="#1a2a1a"/>
  <rect x="6" y="7" width="1" height="1" fill="#1a2a1a"/>
  <rect x="25" y="7" width="1" height="1" fill="#1a2a1a"/>

  <!-- left side -->
  <rect x="5" y="8" width="1" height="14" fill="#1a2a1a"/>
  <!-- right side -->
  <rect x="26" y="8" width="1" height="14" fill="#1a2a1a"/>

  <!-- Top zigzag (red accent band) -->
  <rect x="10" y="8" width="4" height="1" fill="#c44848"/>
  <rect x="18" y="8" width="4" height="1" fill="#c44848"/>
  <rect x="9" y="9" width="2" height="1" fill="#c44848"/>
  <rect x="13" y="9" width="2" height="1" fill="#c44848"/>
  <rect x="17" y="9" width="2" height="1" fill="#c44848"/>
  <rect x="21" y="9" width="2" height="1" fill="#c44848"/>
  <rect x="9" y="10" width="1" height="1" fill="#c44848"/>
  <rect x="14" y="10" width="4" height="1" fill="#c44848"/>
  <rect x="22" y="10" width="1" height="1" fill="#c44848"/>

  <!-- Eyes -->
  <rect x="11" y="12" width="2" height="1" fill="#1a2a1a"/>
  <rect x="19" y="12" width="2" height="1" fill="#1a2a1a"/>
  <rect x="10" y="13" width="4" height="2" fill="#1a2a1a"/>
  <rect x="18" y="13" width="4" height="2" fill="#1a2a1a"/>
  <rect x="11" y="15" width="2" height="1" fill="#1a2a1a"/>
  <rect x="19" y="15" width="2" height="1" fill="#1a2a1a"/>

  <!-- Mouth (smile) -->
  <rect x="12" y="17" width="4" height="1" fill="#1a2a1a"/>
  <rect x="10" y="18" width="2" height="1" fill="#1a2a1a"/>
  <rect x="16" y="18" width="2" height="1" fill="#1a2a1a"/>
  <rect x="10" y="19" width="1" height="1" fill="#1a2a1a"/>
  <rect x="17" y="19" width="1" height="1" fill="#1a2a1a"/>
  <rect x="11" y="20" width="6" height="1" fill="#1a2a1a"/>

  <!-- Bottom zigzag -->
  <rect x="10" y="22" width="4" height="1" fill="#c44848"/>
  <rect x="18" y="22" width="4" height="1" fill="#c44848"/>
  <rect x="9" y="23" width="2" height="1" fill="#c44848"/>
  <rect x="13" y="23" width="2" height="1" fill="#c44848"/>
  <rect x="17" y="23" width="2" height="1" fill="#c44848"/>
  <rect x="21" y="23" width="2" height="1" fill="#c44848"/>
  <rect x="9" y="24" width="1" height="1" fill="#c44848"/>
  <rect x="14" y="24" width="4" height="1" fill="#c44848"/>
  <rect x="22" y="24" width="1" height="1" fill="#c44848"/>

  <!-- Bottom curve -->
  <rect x="6" y="25" width="1" height="1" fill="#1a2a1a"/>
  <rect x="25" y="25" width="1" height="1" fill="#1a2a1a"/>
  <rect x="7" y="26" width="1" height="1" fill="#1a2a1a"/>
  <rect x="24" y="26" width="1" height="1" fill="#1a2a1a"/>
  <rect x="8" y="27" width="2" height="1" fill="#1a2a1a"/>
  <rect x="22" y="27" width="2" height="1" fill="#1a2a1a"/>
  <rect x="10" y="28" width="2" height="1" fill="#1a2a1a"/>
  <rect x="20" y="28" width="2" height="1" fill="#1a2a1a"/>
  <rect x="12" y="29" width="8" height="1" fill="#1a2a1a"/>
</svg>
